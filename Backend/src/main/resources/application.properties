spring.application.name=uvmp
server.port=8080

# Database Configuration (supports env vars with sensible dev defaults)
#spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/uvmp?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/uvmp_ai?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:2312}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.secret=${JWT_SECRET:9a4f2c8d3b7a1e6f5c0d8b2a4e6f1c3d5b7a9e0f2c4d6b8a1e3f5c7d9b0a2e4f}
app.jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}
